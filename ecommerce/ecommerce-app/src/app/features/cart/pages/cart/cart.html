<div class="cart-container">
  <h2>Seu Carrinho</h2>

  <div *ngIf="loading" class="loading">Carregando...</div>

  <div *ngIf="!loading && cart">
    <div *ngIf="cart.items.length === 0" class="empty-cart">
      <p>O seu carrinho está vazio.</p>
      <button mat-raised-color="primary" routerLink="/products">Continuar Comprando</button>
    </div>

    <div *ngIf="cart.items.length > 0" class="cart-content">
      <div class="cart-items">
        <mat-card class="cart-item" *ngFor="let item of cart.items">
          <img *ngIf="item.product.images?.length" [src]="item.product.images[0].url" [alt]="item.product.name">
          <img *ngIf="!item.product.images?.length" src="https://via.placeholder.com/100" alt="Placeholder">
          
          <div class="item-details">
            <h4 routerLink="/products/{{item.product.id}}">{{item.product.name}}</h4>
            <p class="price">{{item.product.price | currency:'BRL'}}</p>
            
            <div class="quantity-controls">
              <button mat-icon-button (click)="updateQuantity(item.id, item.quantity - 1)" [disabled]="item.quantity <= 1">
                <mat-icon>remove</mat-icon>
              </button>
              <span>{{item.quantity}}</span>
              <button mat-icon-button (click)="updateQuantity(item.id, item.quantity + 1)">
                <mat-icon>add</mat-icon>
              </button>
            </div>
          </div>
          
          <div class="item-actions">
            <p class="subtotal">{{ (item.product.price * item.quantity) | currency:'BRL' }}</p>
            <button mat-icon-button color="warn" (click)="removeItem(item.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-card>
      </div>

      <div class="cart-summary">
        <mat-card>
          <mat-card-header>
            <mat-card-title>Resumo</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div class="summary-row total">
              <span>Total:</span>
              <span>{{cart.total | currency:'BRL'}}</span>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-color="primary" class="full-width" routerLink="/checkout">Finalizar Compra</button>
            <button mat-button color="warn" class="full-width mt-10" (click)="clearCart()">Esvaziar Carrinho</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
</div>
